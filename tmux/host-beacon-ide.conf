# =============================================================================
# Host overrides — Beacon IDE (Axpo's platform: a code-server/VS Code terminal
# in a browser, inside a Docker container whose $HOME is wiped on every
# recreate). Not nested like host-remote — this is the only tmux layer running,
# so no prefix collision to avoid.
#
# What follows is this platform's specifics — an ephemeral $HOME with durable
# NFS beside it, and a browser-hosted terminal whose clipboard path is its own
# — not generic container behaviour, so don't reach for this file on another
# container.
# =============================================================================
# Sourced last: everything here overrides the shared confs.

# Pane shell: bash, which hands off to fish at the end of its rc (sh/fish.sh).
#
# Pinned rather than left to tmux's default of inheriting $SHELL: the handoff is
# load-bearing here, because bash's rc is what redirects the $HOME-relative
# defaults onto durable storage and $HOME is wiped on every container recreate.
# sh/fish.sh's header argues the whole case, including why a pane that skipped
# bash fails quietly rather than loudly. Not in options.conf because it is not
# true everywhere: on the Mac $SHELL is already fish, panes are fish directly,
# and sh/fish.sh is not even installed (it ships only with the beacon-ide bash
# profile).
set -g default-shell /bin/bash

# Scrub the handoff's own "already handed off" marker, or the pin above is inert.
#
# sh/fish.sh exports DOTFILES_FISH_SHELL=1 before it execs fish, so a nested
# `bash` typed inside fish stays bash instead of looping. Right for a forked
# child, wrong for a tmux server: start the server from a pane that has already
# handed off and the marker is captured into the server's global environment --
# frozen there, since that environment is a snapshot taken at server start --
# then re-broadcast to every pane it spawns. Each pane's bash concludes it is
# already downstream of a handoff, so every pane silently stays bash and the
# `default-shell` pin above buys nothing. Self-perpetuating, too: kill the
# server, restart it from a fish pane, and the marker is back. Unsetting here
# repairs the whole server, since the config is read at server start and again
# on `prefix R`.
#
# Scoped to this host: the hazard travels with sh/fish.sh, and that module is
# installed by exactly one profile (BASH_BEACON_IDE). No other machine sets the
# marker at all, so none can freeze it. If a future profile ever gains `fish`,
# its host file needs this line too -- symptom is every pane silently staying
# bash, diagnosed with `tmux show-environment -g DOTFILES_FISH_SHELL`, and the
# line promotes to options.conf unchanged if it ever becomes true everywhere.
#
# `-u` (unset in tmux's table) is enough; `-r` (remove before spawning) is not
# needed -- verified by probe. `bash` inside fish stays bash regardless: there
# the marker reaches the child by ordinary env inheritance from the live fish,
# not through this table. A pane spawned as `tmux new-window /bin/bash` does
# NOT, for exactly the reason this line exists -- it hands off like any other.
set-environment -gu DOTFILES_FISH_SHELL

# Prefix — no outer layer here, so the shared C-a is safe (same as host-local).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse stays on (shared default from options.conf) — OSC 52 clipboard is
# broken in this environment regardless of mouse mode (no bridge available
# either way: no xclip/xsel/wl-copy, no $DISPLAY), so turning it off bought
# nothing but lost pane resize/click-select/scroll-wheel. See tmux/README.md
# sharp edges for the actual (unresolved) copy-to-system-clipboard situation.

# No set-titles: this pty's title escapes don't reach the real browser tab
# (VS Code's own terminal panel manages its own label, not the OS window/tab
# chrome), so there's nothing for it to usefully control here.

# Theme: green accent (distinct from local's blue and remote's peach — a
# third, non-nested context gets its own color rather than reusing either).
set -g pane-active-border-style "fg=#a6e3a1,bold"
set -g pane-border-status top
set -g pane-border-format " #P · #{pane_current_command} "
set -g window-status-current-style "bg=#a6e3a1,fg=#1e1e2e,bold"
set -g status-left-length 46
set -g status-left "#[bg=#313244] web:#S #[default]"
