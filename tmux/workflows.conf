# =============================================================================
# Workflows
# =============================================================================
# Binaries are named by absolute path, since run-shell's PATH is the server's:
# `${CLAUDER_USER_HOME:-$HOME}/.local/bin`, where `clauder promote` puts
# clauder/tmx/deck. $CLAUDER_USER_HOME is set where $HOME is ephemeral
# (beacon-ide) and unset on the Macs. Each binding holds it in `b`, inside SINGLE
# quotes so tmux passes it through and /bin/sh expands it at press time (tmux
# would expand `$VAR` in double quotes at parse time, and has no `:-`).
# `#{formats}` are still expanded inside single quotes.
#
# New timestamped chat in the chat-quick session (drives `clauder quake new`).
# -E merges stderr so failures surface in the pane's view-mode.
bind C run-shell -E 'b="${CLAUDER_USER_HOME:-$HOME}/.local/bin"; "$b/clauder" quake new'

# Fork the Claude session in THIS pane into a new pane beside it (drives
# `clauder tmux fork`). Same history, new session id, new transcript, same
# clauder, same directory. A pane with no live Claude session refuses and says
# why, rather than splitting with a fresh claude — one key, one meaning.
#
# Focus lands on the new pane by itself: `split-window` without `-d` selects
# what it creates, so nothing here calls `switch-client`. Deliberate — a
# `switch-client` without `-c` inside `run-shell` picks a client by tmux's own
# heuristic, and was observed yanking an unrelated terminal, which is why
# `bind M-s` two blocks down carries `#{client_tty}` explicitly.
#
# The pane id is passed IN because it cannot be discovered: a `run-shell` job is
# a child of the tmux SERVER, not of a pane, so its `$TMUX_PANE` is the server's
# own inherited value — present, STALE, and possibly a pane on another server
# (measured; workbench's tests/tmx/test_launch_context_canary.py). Trusting it
# would fork a stranger's pane. `run-shell` expands formats in its command
# string, so `#{pane_id}` arrives as an argument. (Formats are not expanded in
# `-t` targets; see `bind M-s`.)
#
# Sharp edges:
#   - run-shell format-expands the WHOLE string before /bin/sh sees it.
#     Measured: `run-shell "tmux split-window -P -F '#{pane_id}'"` prints the
#     TARGET pane's id at rc 0 — a well-formed and completely wrong answer;
#     `##{pane_id}` escapes it. Nothing here trips on that because the split
#     happens inside clauder's own process. It is what would break the day any
#     part of this moved into this file.
#   - `-E` is the whole error channel: it folds stderr into stdout, and ANY
#     stdout opens view mode after the command finishes. Which is also why the
#     command prints nothing on success — the feedback is the pane appearing.
#
# The clauder-side model — the pane→session join, the tmux-epoch guard, mode
# inheritance and the cwd rule — is in workbench's `docs/tmux.md`. tmux
# mechanics stay here; neither page explains the other's half.
bind F run-shell -E 'b="${CLAUDER_USER_HOME:-$HOME}/.local/bin"; "$b/clauder" tmux fork --pane "#{pane_id}"'

# Lazygit in a popup, scoped to the current pane's directory.
# `-d` sets the popup's cwd so lazygit picks up the right repo; `-E` closes
# the popup when lazygit exits.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Fuzzy window switcher across all sessions (shadows default `prefix s`).
# The list, the ordering, the `[Np]` column and the capture-pane preview are
# `tmx switch`; see `tmx switch --help` and src/tmx/choices.py in workbench.
#
# Why `run-shell` and not `display-popup`: a popup's shell-command is NOT
# format-expanded (measured, 3.6a) — `display-popup -E "... '#{client_tty}'"`
# hands the verb the literal string, and `-c '#{client_tty}'` makes the popup
# not run at all. `run-shell` IS expanded, so the tty is captured here and
# `tmx popup` opens the popup on the client it was told. That is also what
# makes the choice of `default-shell` stop mattering: nothing below is shell
# logic.
#
# `-b` because the job holds the popup for as long as the human takes, and a
# non-backgrounded run-shell blocks the command queue. `-E` folds stderr into
# stdout so a popup that cannot open says why in view mode.
#
# Sharp edges:
#   - `session_last_attached` updates on attach/switch-client, not on every
#     keystroke, so the order is stable while you work in one place.
#   - The preview shows the ACTIVE pane only.
bind s run-shell -b -E 'b="${CLAUDER_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/tmx" switch'

# Move the current pane into a fuzzy-picked window, then follow it there.
# The list, the ordering, the `[Np]` column, the capture-pane preview and the
# "drop the window you launched from" guard are `tmx join`; see
# `tmx join --help` and src/tmx/choices.py in workbench.
#
# `--pane '#{pane_id}'` is the whole reason this is `run-shell` and not
# `display-popup`: a popup's shell-command is NOT format-expanded (measured,
# 3.6a), so a popup binding gets the literal string. `run-shell` IS expanded, in
# the PRESSING client's context, and `tmx popup` carries both values in. That is
# also why nothing here is shell logic any more, and why this binding now works
# under a bash `default-shell` as well as fish.
#
# Landing geometry (`-h -f -l 25%`, a quarter of the WINDOW's width down the
# right edge) lives in `tmx join`; `-f` is the load-bearing flag and its
# docstring says why. As with `bind s`: the order is stable while you work
# (`session_last_attached` moves on attach/switch, not per keystroke), and the
# preview shows the ACTIVE pane only.
bind b run-shell -b -E 'b="${CLAUDER_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" --pane "#{pane_id}" -- "$b/tmx" join'

# Move the current WINDOW into a fuzzy-picked session, then follow it there.
# One level up from `bind b`: that sends a pane into a window, this sends a
# whole window into a session. The list (`name [Nw]`, last-attached first, your
# own session dropped) is `tmx move`.
#
# `--window '#{window_id}'` for the same reason `bind b` carries `--pane`.
bind M-b run-shell -b -E 'b="${CLAUDER_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" --window "#{window_id}" -- "$b/tmx" move'

# Spin off an independent VIEW of the current session, focused on this window.
#
# Problem: two terminals attached to one session show the same window — a
# session has exactly one current window, shared by all its clients. To work in
# `workbench:tools` and `workbench:plan` side by side you need two *sessions*
# over one window list. That is a session group (`new-session -t <target>`):
# members share the window list but each keeps its own current window, its own
# clients, and its own size negotiation.
#
# This binding creates the spin-off (`<base>~<window>`), points it at the
# window you pressed from, and moves *this* client to it. The original session
# keeps its name and is left free to attach from another terminal — so the
# usual flow is: press here, then `tmux attach -t workbench` elsewhere.
# Pressing it again on the same window is a no-op that just takes you back to
# the existing view (`has-session` short-circuits the create).
#
# Why the whole body is one run-shell (the pickers above are too, but only to
# hand a `tmx` verb its context; this one computes in shell): formats are
# NOT expanded in `-t` targets (`select-window -t '#{window_id}'` fails with
# "can't find window: #{window_id}"), but run-shell DOES expand formats in its
# command string. So every computed value has to be resolved inside here.
# Single-quoted for the same reason: run-shell does its own expansion, so the
# inner body needs no escaping of its own — the `$`s below are the shell's own
# variables, and sh runs under /bin/sh, not fish (run-shell ignores
# default-shell).
#
#   base  the GROUP name, falling back to the session name. Load-bearing for
#         re-entrancy: pressing this from inside `workbench~plan` must spin off
#         `workbench~tools`, not `workbench~plan~tools`. A session that has ever
#         been grouped keeps its group name forever (even at size 1), so this
#         is stable.
#   win   `#{window_id}` (`@N`), not `#S:#I` — `renumber-windows on`
#         (options.conf) makes indices go stale, and `session:@id` targeting
#         works, which is what aims the fresh session at the right window. It
#         does NOT inherit the source's current window; a new group member
#         always lands on index 1.
#   new   `~` joins base and window name; `tr` folds `.` and `:`, the two
#         characters tmux forbids in session names.
#
# `-c "$cli"` is the load-bearing safety flag. `switch-client` with no `-c`
# inside run-shell does NOT act on the client that pressed the key — it picks
# a client by tmux's own heuristic and will happily yank an UNRELATED terminal
# (observed: a client on another session got dragged into the spin-off). The
# `[ -n "$cli" ]` guard fails closed: with no client in context the binding
# exits silently rather than grabbing the wrong one.
#
# Naming: `command-prompt -I` PRE-FILLS the prompt with the auto-name, so Enter
# accepts it and typing replaces it — rather than "leave blank for the default",
# which hides what the default would have been. `#{?session_group,...}` in the
# `-I` value reproduces the same group-name fallback as `base` below.
#
# Nothing sanitizes the name here on purpose: tmux itself maps `.` and `:` to
# `_` when creating a session (`-s 'zz:a.b'` lands as `zz_a_b`), so a window
# named `ns:cfg` just becomes `base~ns_cfg`. Do not be tempted to fold them in
# the format instead — tmux cannot express it: `#{s/:/-/:window_name}` returns
# EMPTY, because the `:` being matched collides with the format's own `:`
# separator, and any `[...]` character class in an `s///` yields empty too.
# The one visible seam is that `-I` shows the pre-sanitized name, so the prompt
# can read `base~ns:cfg` while the session lands as `base~ns_cfg`.
# A typed name is used VERBATIM — no
# `<base>~` prefix — so custom views can be named whatever reads best; they stay
# in the group regardless, since group membership comes from `new-session -t`,
# not from the name. (Clearing the prompt and pressing Enter falls back to the
# auto-name, so an empty submit can never create an unnamed session.)
#
# Escaping in the template, because it must be tmux-double-quoted — the shell
# body needs single quotes to protect its `$`s, which forces double quotes on
# the outside:
#   \"  → "    (the shell body's own double quotes)
#   \$  → $    (the shell's variables, kept from tmux)
#   `\` at end of a line continues to the next line during tmux config parse,
#   joining everything into one logical command before the shell sees it.
#
# Sharp edges:
#   - The window list is SHARED, not copied. Creating/killing/renaming a
#     window in either view happens in both; only "which window am I looking
#     at" is per-view.
#   - `tmx switch` / `tmx join` (`bind s` / `bind b`) list every window once
#     PER group member, so each spin-off doubles the rows. Each row names its
#     member, so picking one lands you in that view.
#   - Killing a spin-off is safe: windows live as long as any group member
#     does. The group itself dies with its last session.
#   - `%%` splices the typed text into the command string RAW. A `'` in the name
#     would close the shell body's quote and break the command; `-I` inputs are
#     also comma-separated, so a `,` in a window name truncates the pre-fill.
#     Neither is worth defending against — tmux offers no quoting-safe
#     substitution — but don't put quotes in a view name.
#   - Typing the name of an existing session ATTACHES to it rather than erroring,
#     even one outside this group. That is the same short-circuit that makes a
#     repeat press return you to an existing view.
bind M-s command-prompt \
  -I "#{?session_group,#{session_group},#{session_name}}~#{window_name}" \
  -p "View name:" \
  "run-shell '\
     new=\"%%\"; \
     cli=\"#{client_tty}\"; \
     win=\"#{window_id}\"; \
     base=\"#{session_group}\"; [ -n \"\$base\" ] || base=\"#{session_name}\"; \
     [ -n \"\$cli\" ] || exit 0; \
     [ -n \"\$new\" ] || new=\"\$base~#{window_name}\"; \
     tmux has-session -t \"=\$new\" 2>/dev/null \
       || tmux new-session -d -t \"=\$base\" -s \"\$new\"; \
     tmux select-window -t \"\$new:\$win\"; \
     tmux switch-client -c \"\$cli\" -t \"\$new\"'"

# deck: a key TABLE, so deck verbs share one leader instead of spending a
# top-level chord each. `prefix d` enters the `deck` table (shadowing
# detach-client, never used on purpose); the next key picks
# the verb. Any key not bound in the table (Escape included) drops back to the
# root table having done nothing, and `prefix d ?` lists what is bound here
# with the `-N` notes.
#
# The verbs are hosted exactly like `bind s` above: `run-shell` expands
# `#{client_tty}` in the PRESSING client's context, `tmx popup` opens the popup
# on that client, and the verb's bare form opens fzf over every declared area /
# open workstream. `--client` is load-bearing for the same reason as `bind M-s`:
# the switch at the end must move this terminal, not tmux's heuristic pick.
# `-b` and `-E` as for `bind s`. The model (areas, workstreams, labels, what
# `switch` renders) is workbench's `docs/deck.md`.
#
# Sharp edges:
#   - `deck ws switch` creates the workstream's window with no `-d`, and
#     `switch-client` moves every client attached to that session, not just
#     this one. Known and accepted on the workbench side.
#   - Closed workstreams are not listed and cannot be reached from here.
bind -N "deck: enter the deck key table" d switch-client -T deck
bind -N "deck: switch workstream" -T deck w run-shell -b -E 'b="${CLAUDER_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" ws switch'
bind -N "deck: switch area" -T deck a run-shell -b -E 'b="${CLAUDER_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" area switch'
bind -N "deck: list these keys" -T deck ? list-keys -N -T deck
