# =============================================================================
# Workflows
# =============================================================================
# New timestamped chat in the chat-quick session (drives `clauder quake new`).
# Absolute path sidesteps run-shell PATH-inheritance variance; -E merges
# stderr so failures surface in the pane's view-mode.
bind C run-shell -E "~/.local/bin/clauder quake new"

# Lazygit in a popup, scoped to the current pane's directory.
# `-d` sets the popup's cwd so lazygit picks up the right repo; `-E` closes
# the popup when lazygit exits.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Fuzzy window switcher across all sessions (shadows default `prefix s`).
#
# Pipeline:
#   list-windows ──▶ sort ──▶ cut ──▶ awk ──▶ fzf ──▶ cut ──▶ switch-client
#
# Sort order: sessions by `session_last_attached` desc, windows by index asc
# within each session. So recently-used sessions cluster on top, with their
# windows in natural order. Sort keys are prepended as fields 1-2 and stripped
# by the first cut. (`-k1,1nr -k2,2n` = numeric reverse on key 1, numeric on key 2.)
#
# After the strip, each fzf row has two pipe-separated fields:
#   field 1 = "session:index"  ← machine target, hidden via `--with-nth=2`
#   field 2 = "session → window  [Np]"  ← human display, what you fuzzy-match
# After picking, the second cut extracts field 1 for `switch-client -t`.
#
# Two-pass awk: first stores all rows + tracks max display width, then in END
# emits with `%-*s` width = max+2 so the [Np] column aligns. Note `length()`
# counts bytes — the `→` is 3 UTF-8 bytes — so alignment is in bytes, not
# visible cols. Equally off on every row, so it visually aligns regardless.
#
# Escaping convention inside this tmux double-quoted string:
#   \"  → "    (so awk sees its own quoted strings)
#   \$  → $    (awk's $1/$2/$3/$4 — fish never expands; it's inside awk's '...')
#   \\n → \n   (literal backslash-n in awk's printf format string)
#   \\| → \|   (fzf's -d delimiter is a regex: a bare | is alternation that
#   matches the empty string between every character, splitting each char
#   into its own field — escaped, it's a literal pipe separator)
#   `\` at end of a line continues to the next line during tmux config parse,
#   joining everything into one logical command before the shell sees it.
#
# Preview: `capture-pane -p` writes the visible pane content to stdout, `-e`
# emits ANSI colors, and fzf's `--ansi` renders them. `{1}` is fzf's first-
# field placeholder (with `-d '|'`) — that's our session:index target.
#
# Sharp edges:
#   - `|` in a window/session name would break the delimiter. Unlikely in
#     practice; if it ever happens, swap delimiter to a tab or `:::`.
#   - `xargs -r` makes Esc/Ctrl-C in fzf a clean no-op (empty input → skip).
#   - Active pane only in preview — multi-pane windows show just the focused one.
#   - `session_last_attached` updates on attach/switch-client, not on every
#     keystroke. So order is stable while you work in one place.
bind s display-popup -E -w 90% -h 80% \
  "tmux list-windows -a -F '#{session_last_attached}|#I|#S:#I|#S|#W|#{window_panes}' \
   | sort -t'|' -k1,1nr -k2,2n \
   | cut -d'|' -f3- \
   | awk -F'|' '\
       { t[NR]=\$1; d[NR]=\$2\" → \"\$3; c[NR]=\$4; \
         if (length(d[NR])>m) m=length(d[NR]) } \
       END { for (i=1;i<=NR;i++) \
               printf \"%s|%-*s [%sp]\\n\", t[i], m+2, d[i], c[i] }' \
   | fzf --reverse -d '\\|' --with-nth=2 --ansi \
       --preview 'tmux capture-pane -ep -t {1}' \
       --preview-window=right:50% \
   | cut -d'|' -f1 \
   | xargs -r tmux switch-client -t"

# Move the current pane into a fuzzy-picked window, then follow it there.
#
# Same picker as `bind s` above (pipeline shape + escaping convention live in
# that block). Unlike `bind s`, which happens to be shell-agnostic, this binding
# is written for fish deliberately: popups run under `default-shell` (fish here),
# and we need two values resolved at launch, which fish captures with `set`.
# Three deltas from `bind s`:
#
#   1. `set src` / `set cur` grab the originating pane and window up front via
#      `display-message`. ($TMUX_PANE is NOT inherited into popups — it resolves
#      empty — but `display-message` reports the client's active pane/window from
#      inside the popup, so that is the source of truth.)
#   2. The carried target field is `#{window_id}` (a stable `@N`) instead of
#      `#S:#I`. With `renumber-windows on` (options.conf), moving a pane that is
#      ALONE in its window closes that window and renumbers its session, so an
#      index captured pre-move can go stale. A window-id never does — `join-pane`
#      and `switch-client` both target the same `@id`. It doubles as the preview
#      target ({1}) just like `#S:#I` did.
#   3. An awk guard (`$1==cur`) drops the launching window from the list so you
#      can't pick it and eat a "can't join to its own window" error. We exclude
#      it by *id*, not via `list-windows -f` on active+attached: you routinely
#      run several attached sessions at once, and that filter would also drop
#      every OTHER session's active window — ones you may want to move into.
#      (`n`, not `NR`, counts kept rows so the skip never emits a blank line.)
#
# The tail moves instead of switches: `xargs` feeds the chosen `@id` to one tmux
# invocation chaining `join-pane -s $src` then `switch-client` (the literal ';'
# is tmux's command separator). `-s $src` is explicit because `join-pane`'s
# default source is the *marked* pane if one is set (you have a Mark binding),
# which would silently move the wrong pane.
#
# Landing geometry: `-h -f -l 25%` puts the pane down the right edge at 25% of
# the *window's* width, full height. `-f` (full) is the load-bearing flag —
# without it a split is carved out of the target's ACTIVE pane only (so `-l 25%`
# would be 25% of that pane and the result would sit wherever that pane is); `-f`
# measures against the whole window, so no per-pane arithmetic and the existing
# layout just compresses to the left. `-h` = side-by-side (vs `-v` stacked); no
# `-b` lands it right/below, add `-b` for left/above. `xargs -r` makes Esc/Ctrl-C
# a clean no-op.
bind b display-popup -E -w 90% -h 80% "\
  set -l cur (tmux display-message -p '#{window_id}'); \
  set -l src (tmux display-message -p '#{pane_id}'); \
  tmux list-windows -a -F '#{session_last_attached}|#I|#{window_id}|#S|#W|#{window_panes}' \
   | sort -t'|' -k1,1nr -k2,2n \
   | cut -d'|' -f3- \
   | awk -F'|' -v cur=\$cur '\
       \$1==cur { next } \
       { n++; t[n]=\$1; d[n]=\$2\" → \"\$3; c[n]=\$4; \
         if (length(d[n])>m) m=length(d[n]) } \
       END { for (i=1;i<=n;i++) \
               printf \"%s|%-*s [%sp]\\n\", t[i], m+2, d[i], c[i] }' \
   | fzf --reverse -d '\\|' --with-nth=2 --ansi \
       --preview 'tmux capture-pane -ep -t {1}' \
       --preview-window=right:50% \
   | cut -d'|' -f1 \
   | xargs -r -I'{}' tmux join-pane -h -f -l 25% -s \$src -t '{}' ';' switch-client -t '{}'"

# Move the current WINDOW into a fuzzy-picked session, then follow it there.
#
# One level up from `bind b`: that sends a pane into a window, this sends a
# whole window into a session. Same popup/fish/fzf shape (pipeline + escaping
# convention live in the `bind s` block). Deltas from `bind b`:
#
#   1. Source is `#{window_id}` (`@N`) and the picked target is
#      `#{session_id}` (`$N`) — both stable under `renumber-windows on`.
#      `cur` is the current *session*, excluded from the list by the same awk
#      guard (moving a window into its own session is just an index shuffle).
#   2. `list-sessions`, so one sort key (last-attached desc) instead of two —
#      there is no per-session index to order within. Rows are `name [Nw]`.
#   3. No geometry flags: a window arrives whole. The source session's indices
#      close up on their own via `renumber-windows on` (options.conf).
#
# `-t '{}'` being a BARE session id is load-bearing. tmux only picks the next
# free index when the `-t` argument contains no `:` or `.`; write `$N:` with
# the colon and it resolves to that session's *current* window instead and
# fails with "index in use". Session *ids* can never contain those chars —
# session names could, which is the other reason to carry the id.
#
# The tail chains three commands (literal ';' is tmux's separator):
# `move-window`, then `select-window -t $src` to point the destination session
# at the freshly-moved window, then `switch-client`. select-window comes first
# so the client lands directly on the moved window rather than flashing the
# destination's previous current-window for a frame; a bare `@N` target is
# resolved globally, so it needs no session prefix. Moving a session's last
# window destroys that session — harmless here, the client is already leaving.
#
# fzf shell-quotes `{1}` in the preview, so the `$N` target survives the
# preview shell unexpanded (`@N` in `bind b` had nothing to lose either way).
bind M-b display-popup -E -w 90% -h 80% "\
  set -l cur (tmux display-message -p '#{session_id}'); \
  set -l src (tmux display-message -p '#{window_id}'); \
  tmux list-sessions -F '#{session_last_attached}|#{session_id}|#S|#{session_windows}' \
   | sort -t'|' -k1,1nr \
   | cut -d'|' -f2- \
   | awk -F'|' -v cur=\$cur '\
       \$1==cur { next } \
       { n++; t[n]=\$1; d[n]=\$2; c[n]=\$3; \
         if (length(d[n])>m) m=length(d[n]) } \
       END { for (i=1;i<=n;i++) \
               printf \"%s|%-*s [%sw]\\n\", t[i], m+2, d[i], c[i] }' \
   | fzf --reverse -d '\\|' --with-nth=2 --ansi \
       --preview 'tmux capture-pane -ep -t {1}' \
       --preview-window=right:50% \
   | cut -d'|' -f1 \
   | xargs -r -I'{}' tmux move-window -s \$src -t '{}' ';' select-window -t \$src ';' switch-client -t '{}'"

# Spin off an independent VIEW of the current session, focused on this window.
#
# Problem: two terminals attached to one session show the same window — a
# session has exactly one current window, shared by all its clients. To work in
# `workbench:tools` and `workbench:plan` side by side you need two *sessions*
# over one window list. That is a session group (`new-session -t <target>`):
# members share the window list but each keeps its own current window, its own
# clients, and its own size negotiation.
#
# This binding creates the spin-off (`<base>~<window>`), points it at the
# window you pressed from, and moves *this* client to it. The original session
# keeps its name and is left free to attach from another terminal — so the
# usual flow is: press here, then `tmux attach -t workbench` elsewhere.
# Pressing it again on the same window is a no-op that just takes you back to
# the existing view (`has-session` short-circuits the create).
#
# Why the whole body is one run-shell, unlike the pickers above: formats are
# NOT expanded in `-t` targets (`select-window -t '#{window_id}'` fails with
# "can't find window: #{window_id}"), but run-shell DOES expand formats in its
# command string. So every computed value has to be resolved inside here.
# Single-quoted for the same reason: run-shell does its own expansion, so the
# `\"` / `\$` escaping convention from the `bind s` block is unnecessary — the
# `$`s below are the shell's own variables, and sh runs under /bin/sh, not
# fish (run-shell ignores default-shell; the popup bindings above do not).
#
#   base  the GROUP name, falling back to the session name. Load-bearing for
#         re-entrancy: pressing this from inside `workbench~plan` must spin off
#         `workbench~tools`, not `workbench~plan~tools`. A session that has ever
#         been grouped keeps its group name forever (even at size 1), so this
#         is stable.
#   win   `#{window_id}` (`@N`), not `#S:#I` — `renumber-windows on`
#         (options.conf) makes indices go stale, and `session:@id` targeting
#         works, which is what aims the fresh session at the right window. It
#         does NOT inherit the source's current window; a new group member
#         always lands on index 1.
#   new   `~` joins base and window name; `tr` folds `.` and `:`, the two
#         characters tmux forbids in session names.
#
# `-c "$cli"` is the load-bearing safety flag. `switch-client` with no `-c`
# inside run-shell does NOT act on the client that pressed the key — it picks
# a client by tmux's own heuristic and will happily yank an UNRELATED terminal
# (observed: a client on another session got dragged into the spin-off). The
# `[ -n "$cli" ]` guard fails closed: with no client in context the binding
# exits silently rather than grabbing the wrong one.
#
# Naming: `command-prompt -I` PRE-FILLS the prompt with the auto-name, so Enter
# accepts it and typing replaces it — rather than "leave blank for the default",
# which hides what the default would have been. `#{?session_group,...}` in the
# `-I` value reproduces the same group-name fallback as `base` below.
#
# Nothing sanitizes the name here on purpose: tmux itself maps `.` and `:` to
# `_` when creating a session (`-s 'zz:a.b'` lands as `zz_a_b`), so a window
# named `ns:cfg` just becomes `base~ns_cfg`. Do not be tempted to fold them in
# the format instead — tmux cannot express it: `#{s/:/-/:window_name}` returns
# EMPTY, because the `:` being matched collides with the format's own `:`
# separator, and any `[...]` character class in an `s///` yields empty too.
# The one visible seam is that `-I` shows the pre-sanitized name, so the prompt
# can read `base~ns:cfg` while the session lands as `base~ns_cfg`.
# A typed name is used VERBATIM — no
# `<base>~` prefix — so custom views can be named whatever reads best; they stay
# in the group regardless, since group membership comes from `new-session -t`,
# not from the name. (Clearing the prompt and pressing Enter falls back to the
# auto-name, so an empty submit can never create an unnamed session.)
#
# Escaping here follows the `bind s` convention (`\"` → `"`, `\$` → `$`) because
# the template must be tmux-double-quoted: the shell body needs single quotes to
# protect its `$`s, which forces double quotes on the outside.
#
# Sharp edges:
#   - The window list is SHARED, not copied. Creating/killing/renaming a
#     window in either view happens in both; only "which window am I looking
#     at" is per-view.
#   - `bind s` / `bind b` list every window once PER group member, so each
#     spin-off doubles the rows (both carry the same `@id`, so either pick
#     works — it is noise, not breakage).
#   - Killing a spin-off is safe: windows live as long as any group member
#     does. The group itself dies with its last session.
#   - `%%` splices the typed text into the command string RAW. A `'` in the name
#     would close the shell body's quote and break the command; `-I` inputs are
#     also comma-separated, so a `,` in a window name truncates the pre-fill.
#     Neither is worth defending against — tmux offers no quoting-safe
#     substitution — but don't put quotes in a view name.
#   - Typing the name of an existing session ATTACHES to it rather than erroring,
#     even one outside this group. That is the same short-circuit that makes a
#     repeat press return you to an existing view.
bind M-s command-prompt \
  -I "#{?session_group,#{session_group},#{session_name}}~#{window_name}" \
  -p "View name:" \
  "run-shell '\
     new=\"%%\"; \
     cli=\"#{client_tty}\"; \
     win=\"#{window_id}\"; \
     base=\"#{session_group}\"; [ -n \"\$base\" ] || base=\"#{session_name}\"; \
     [ -n \"\$cli\" ] || exit 0; \
     [ -n \"\$new\" ] || new=\"\$base~#{window_name}\"; \
     tmux has-session -t \"=\$new\" 2>/dev/null \
       || tmux new-session -d -t \"=\$base\" -s \"\$new\"; \
     tmux select-window -t \"\$new:\$win\"; \
     tmux switch-client -c \"\$cli\" -t \"\$new\"'"
