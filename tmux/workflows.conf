# =============================================================================
# Workflows
# =============================================================================
# Binaries are named by absolute path, since run-shell's PATH is the server's:
# `${WB_USER_HOME:-$HOME}/.local/bin`, where `clauder promote` puts
# clauder/tmx/deck. $WB_USER_HOME is set where $HOME is ephemeral
# (beacon-ide) and unset on the Macs. Each binding holds it in `b`, inside SINGLE
# quotes so tmux passes it through and /bin/sh expands it at press time (tmux
# would expand `$VAR` in double quotes at parse time, and has no `:-`).
# `#{formats}` are still expanded inside single quotes.
#
# Two launchers, both from workbench's `tmx` (src/tmx/CLAUDE.md, "Drawing on a
# client"), and every binding below that runs a workbench verb uses one of them:
#
#   tmx popup --client "#{client_tty}" -- VERB   the verb may ASK (a picker, a
#       guided flow, a y/N) or PAGES a list: it needs a terminal, so it gets a
#       popup on the client that pressed the key.
#   tmx run   --client "#{client_tty}" -- VERB   the verb never asks: no popup;
#       success becomes one status message, a failure opens view mode and stays
#       until `q`.
#
# Why `run-shell` around both: a popup's command is NOT format-expanded and
# run-shell's is, so `#{client_tty}` is captured here, in the PRESSING client's
# context. `--client` is all a binding passes: the launcher derives the pressed
# pane, its window and its directory from the client, starts the verb in that
# directory, and hands the context over as TMX_* environment variables, which a
# verb that does not care ignores. That is why bindings pass no --pane, and
# --window only where the deck section says why, and why none of this depends
# on `default-shell`.
#
# `-b` everywhere: a popup is held for as long as you take, and a blocking
# run-shell holds the command queue. `-E` everywhere: both launchers are silent
# on success, so `-E` only ever adds stderr to a failure (a `tmx run` verb that
# failed, or a launcher that could not start), which then stays visible.
#
# Sharp edge, kept from the old version of this file because it bites anyone who
# moves logic in here: run-shell format-expands the WHOLE string before /bin/sh
# sees it. `run-shell "tmux split-window -P -F '#{pane_id}'"` prints the TARGET
# pane's id at rc 0, a well-formed and completely wrong answer; `##{pane_id}`
# escapes it.

# New timestamped chat in the chat-quick session (`clauder quake new`).
bind -N "clauder: new quick chat" C run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" run --client "#{client_tty}" -- "$b/clauder" quake new'

# Fork the Claude session in THIS pane into a new pane beside it (`clauder tmux
# fork`). Same history, new session id, new transcript, same clauder, same
# directory. A pane with no live Claude session refuses and says why (view
# mode), rather than splitting with a fresh claude: one key, one meaning.
#
# "This pane" is the pressed pane, which `tmx run` derives from the client and
# hands over as $TMX_PANE. It is never the job's own $TMUX_PANE: a run-shell job
# is a child of the tmux SERVER, so that is the server's inherited value,
# present, STALE, and possibly a pane on another server (measured; workbench's
# tests/tmx/test_launch_context_canary.py). Focus lands on the new pane by
# itself: `split-window` without `-d` selects what it creates, so nothing calls
# `switch-client`. The clauder-side model (the pane->session join, the
# tmux-epoch guard, mode inheritance, the cwd rule) is workbench's
# `docs/tmux.md`.
bind -N "clauder: fork this pane's claude-session" F run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" run --client "#{client_tty}" -- "$b/clauder" tmux fork'

# Lazygit in a popup, scoped to the current pane's directory. Not a workbench
# verb, so no launcher: `display-popup -d` IS format-expanded when bound
# directly; `-E` closes the popup when lazygit exits.
bind -N "lazygit in this pane's directory" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Fuzzy window switcher across all sessions (shadows default `prefix s`). The
# list, the ordering, the `[Np]` column and the capture-pane preview are
# `tmx switch`; see `tmx switch --help`.
#
# Sharp edges:
#   - `session_last_attached` updates on attach/switch-client, not on every
#     keystroke, so the order is stable while you work in one place.
#   - The preview shows the ACTIVE pane only.
bind -N "tmx: switch to any window" s run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/tmx" switch'

# Move the current pane into a fuzzy-picked window, then follow it there
# (`tmx join`: the list, the `[Np]` column, the preview, the "drop the window
# you launched from" guard, and the landing geometry, whose `-f` flag is
# load-bearing; its docstring says why). The pane is the pressed one, derived
# by `tmx popup` from the client.
bind -N "tmx: move this pane into another window" b run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/tmx" join'

# Move the current WINDOW into a fuzzy-picked session, then follow it there.
# One level up from `bind b`. The list (`name [Nw]`, last-attached first, your
# own session dropped) is `tmx move`.
bind -N "tmx: move this window into another session" M-b run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/tmx" move'

# Spin off an independent VIEW of the current session, focused on this window.
#
# Problem: two terminals attached to one session show the same window — a
# session has exactly one current window, shared by all its clients. To work in
# `workbench:tools` and `workbench:plan` side by side you need two *sessions*
# over one window list. That is a session group (`new-session -t <target>`):
# members share the window list but each keeps its own current window, its own
# clients, and its own size negotiation.
#
# This binding creates the spin-off (`<base>~<window>`), points it at the
# window you pressed from, and moves *this* client to it. The original session
# keeps its name and is left free to attach from another terminal — so the
# usual flow is: press here, then `tmux attach -t workbench` elsewhere.
# Pressing it again on the same window is a no-op that just takes you back to
# the existing view (`has-session` short-circuits the create).
#
# Why the whole body is one run-shell, and not a workbench launcher: this one
# computes in shell. Formats are NOT expanded in `-t` targets
# (`select-window -t '#{window_id}'` fails with "can't find window:
# #{window_id}"), but run-shell DOES expand formats in its command string. So
# every computed value has to be resolved inside here. Single-quoted for the
# same reason: run-shell does its own expansion, so the inner body needs no
# escaping of its own — the `$`s below are the shell's own variables, and sh
# runs under /bin/sh, not fish (run-shell ignores default-shell).
#
#   base  the GROUP name, falling back to the session name. Load-bearing for
#         re-entrancy: pressing this from inside `workbench~plan` must spin off
#         `workbench~tools`, not `workbench~plan~tools`. A session that has ever
#         been grouped keeps its group name forever (even at size 1), so this
#         is stable.
#   win   `#{window_id}` (`@N`), not `#S:#I` — `renumber-windows on`
#         (options.conf) makes indices go stale, and `session:@id` targeting
#         works, which is what aims the fresh session at the right window. It
#         does NOT inherit the source's current window; a new group member
#         always lands on index 1.
#   new   `~` joins base and window name.
#
# `-c "$cli"` is the load-bearing safety flag. `switch-client` with no `-c`
# inside run-shell does NOT act on the client that pressed the key — it picks
# a client by tmux's own heuristic and will happily yank an UNRELATED terminal
# (observed: a client on another session got dragged into the spin-off). The
# `[ -n "$cli" ]` guard fails closed: with no client in context the binding
# exits silently rather than grabbing the wrong one.
#
# Naming: `command-prompt -I` PRE-FILLS the prompt with the auto-name, so Enter
# accepts it and typing replaces it — rather than "leave blank for the default",
# which hides what the default would have been. `#{?session_group,...}` in the
# `-I` value reproduces the same group-name fallback as `base` below.
#
# Nothing sanitizes the name here on purpose: tmux itself maps `.` and `:` to
# `_` when creating a session (`-s 'zz:a.b'` lands as `zz_a_b`), so a window
# named `ns:cfg` just becomes `base~ns_cfg`. Folding them in the format instead
# cannot be done for `:`: any `s///` whose pattern contains a `:` returns EMPTY
# (`#{s/:/-/:window_name}` and `#{s/[:]/-/:window_name}` both do), because it
# collides with the format's own `:` separator. Other classes work
# (`#{s/[.]/_/:window_name}` does; measured on 3.6a), so only `:` is out of
# reach. The one visible seam is that `-I` shows the pre-sanitized name, so the
# prompt can read `base~ns:cfg` while the session lands as `base~ns_cfg`.
# A typed name is used VERBATIM — no
# `<base>~` prefix — so custom views can be named whatever reads best; they stay
# in the group regardless, since group membership comes from `new-session -t`,
# not from the name. (Clearing the prompt and pressing Enter falls back to the
# auto-name, so an empty submit can never create an unnamed session.)
#
# Escaping in the template, because it must be tmux-double-quoted — the shell
# body needs single quotes to protect its `$`s, which forces double quotes on
# the outside:
#   \"  → "    (the shell body's own double quotes)
#   \$  → $    (the shell's variables, kept from tmux)
#   `\` at end of a line continues to the next line during tmux config parse,
#   joining everything into one logical command before the shell sees it.
#
# Sharp edges:
#   - The window list is SHARED, not copied. Creating/killing/renaming a
#     window in either view happens in both; only "which window am I looking
#     at" is per-view.
#   - `tmx switch` / `tmx join` (`bind s` / `bind b`) list every window once
#     PER group member, so each spin-off doubles the rows. Each row names its
#     member, so picking one lands you in that view.
#   - Killing a spin-off is safe: windows live as long as any group member
#     does. The group itself dies with its last session.
#   - `%%` splices the typed text into the command string RAW. A `'` in the name
#     would close the shell body's quote and break the command; `-I` inputs are
#     also comma-separated, so a `,` in a window name truncates the pre-fill.
#     Neither is worth defending against — tmux offers no quoting-safe
#     substitution — but don't put quotes in a view name.
#   - Typing the name of an existing session ATTACHES to it rather than erroring,
#     even one outside this group. That is the same short-circuit that makes a
#     repeat press return you to an existing view.
bind -N "view this session from here (a grouped session)" M-s command-prompt \
  -I "#{?session_group,#{session_group},#{session_name}}~#{window_name}" \
  -p "View name:" \
  "run-shell '\
     new=\"%%\"; \
     cli=\"#{client_tty}\"; \
     win=\"#{window_id}\"; \
     base=\"#{session_group}\"; [ -n \"\$base\" ] || base=\"#{session_name}\"; \
     [ -n \"\$cli\" ] || exit 0; \
     [ -n \"\$new\" ] || new=\"\$base~#{window_name}\"; \
     tmux has-session -t \"=\$new\" 2>/dev/null \
       || tmux new-session -d -t \"=\$base\" -s \"\$new\"; \
     tmux select-window -t \"\$new:\$win\"; \
     tmux switch-client -c \"\$cli\" -t \"\$new\"'"

# -----------------------------------------------------------------------------
# deck: areas and workstreams (the model is workbench's `docs/deck.md`)
# -----------------------------------------------------------------------------
# A key TABLE holds the whole set, and the two things done many times a day
# also get a top-level key. `prefix w` and `prefix n` ARE `prefix d w` and
# `prefix d n`: one letter, one meaning, whichever way you reach it. They
# shadow tmux's choose-tree and next-window, both already covered: `prefix s`
# is every window, fuzzy, with a preview; `prefix C-j` is next-window, and
# repeats.
#
# `prefix d` enters the `deck` table (shadowing detach-client; `prefix D` still
# detaches). The next key picks the verb. Any key not bound here, Escape
# included, drops back to the root table having done nothing, and
# `prefix d ?` lists the table with its notes. Nothing repeats (no `-r`): each
# verb opens a popup or runs once, and no key reaches tmux while a popup is
# open anyway.
#
# Lowercase acts on "here"; Shift is the variant:
#   w  switch: areas, with their open workstreams under them   a  areas only
#   n  new workstream in this area     N  ...in another area (picker first)
#   A  new area (path defaults to this pane's directory)
#   W  this tmux-window becomes a workstream, named after the window
#   x  close this window's workstream  X  ...but keep the window, unlabelled
#   l  running claude-sessions         L  jump to one
#   o  owner of this pane's claude-session   O  assign it
#   h  history of this window's owner
#
# Inside the new-workstream and new-area popups: `tab` picks another area (or,
# for a new area, names its first workstream), `ctrl-o` another path, `enter`
# creates, `esc` cancels. The new-workstream area step only picks a DECLARED
# area: a name matching nothing is refused there and pointed at `deck area
# new`. A new area is `prefix d A`, nowhere else. From a window outside any
# area, `prefix n` opens on the area step.
#
# Launchers (see the top of this file): pickers, the guided flows, `x` (its y/N)
# and the paged lists are `tmx popup`; `W` and `X` never ask, so they are
# `tmx run` and answer in the status line. The new and close popups are small
# (50% x 40%): a name step and its legend, an area or path list, or a short y/N.
#
# `x`, `X` and `W` act on THIS window, so they also pin it: `--window
# "#{window_id}"` is captured at the press, like the client. Without it the
# launcher derives the window from the client a moment later, and a window
# switch in that instant would close or label the wrong one. Every other key
# passes `--client` only.
#
# Sharp edges:
#   - Going to a workstream moves EVERY client on that area's tmux-session to
#     its window: `switch-client -t @N` selects the window IN the session, and
#     tmux has no per-client current window. (`-d` on the window's creation
#     would not change that; measured.) A grouped view (`prefix M-s`) is the
#     way to look at two windows of one area at once, but creating or
#     switching from inside a view lands you in the base session.
#   - `x` is for good: there is no reopen. It asks y/N only when claude-sessions
#     are running in a window it would kill; otherwise the window goes at
#     once. It never detaches you: the last window of a tmux-session is
#     replaced by a plain one at the area's path first. In a plain window (no
#     workstream) it does nothing and says so.
#   - A closed workstream whose window is still up (from before close took its
#     windows) is tidied by pressing `x` in that window.
#   - `deck ws rm` and `deck area rm` are deliberately unbound: rare, and
#     destructive.
bind -N "deck: switch area or workstream" w run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" switch'
bind -N "deck: new workstream in this area" n run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" --width 50% --height 40% -- "$b/deck" ws new'
bind -N "deck: enter the deck key table" d switch-client -T deck

bind -N "deck: switch area or workstream" -T deck w run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" switch'
bind -N "deck: switch area" -T deck a run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" area switch'
bind -N "deck: new workstream in this area" -T deck n run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" --width 50% --height 40% -- "$b/deck" ws new'
bind -N "deck: new workstream in another area" -T deck N run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" --width 50% --height 40% -- "$b/deck" ws new --ask area'
bind -N "deck: new area" -T deck A run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" --width 50% --height 40% -- "$b/deck" area new'
bind -N "deck: make this tmux-window a workstream" -T deck W run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" run --client "#{client_tty}" --window "#{window_id}" -- "$b/deck" ws new --here'
bind -N "deck: close this window's workstream" -T deck x run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" --window "#{window_id}" --width 50% --height 40% -- "$b/deck" ws close'
bind -N "deck: close this window's workstream, keep the window" -T deck X run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" run --client "#{client_tty}" --window "#{window_id}" -- "$b/deck" ws close --keep-window'
bind -N "deck: running claude-sessions" -T deck l run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" live'
bind -N "deck: jump to a running claude-session" -T deck L run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" live --pick'
bind -N "deck: owner of this pane's claude-session" -T deck o run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" owner'
bind -N "deck: assign this pane's claude-session" -T deck O run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" assign'
bind -N "deck: history of this window's owner" -T deck h run-shell -b -E 'b="${WB_USER_HOME:-$HOME}/.local/bin"; "$b/tmx" popup --client "#{client_tty}" -- "$b/deck" history'
bind -N "deck: list these keys" -T deck ? list-keys -N -T deck
