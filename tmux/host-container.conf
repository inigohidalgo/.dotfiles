# =============================================================================
# Host overrides — containerized IDE (code-server/VS Code terminal in a
# browser, e.g. Beacon IDE). Not nested like host-remote — this is the only
# tmux layer running, so no prefix collision to avoid.
# =============================================================================
# Sourced last: everything here overrides the shared confs.

# Pane shell: bash, which hands off to fish at the end of its rc (sh/fish.sh).
#
# Pinned rather than left to tmux's default of inheriting $SHELL, because on
# this machine the handoff is load-bearing: bash's rc is what redirects the
# $HOME-relative defaults onto durable storage, and $HOME here is wiped on every
# container recreate. A pane that skipped bash would instead inherit the tmux
# server's environment -- a snapshot frozen when the server started and never
# refreshed, so a stale *subset* rather than nothing, which fails quietly. Not
# in options.conf because it is not true everywhere: on the Mac $SHELL is
# already fish, panes are fish directly, and sh/fish.sh never runs.
set -g default-shell /bin/bash

# Scrub the handoff's own "already handed off" marker, or the pin above is inert.
#
# sh/fish.sh exports DOTFILES_FISH_SHELL=1 before it execs fish, so a nested
# `bash` typed inside fish stays bash instead of looping. Right for a forked
# child, wrong for a tmux server: start the server from a pane that has already
# handed off and the marker is captured into the server's global environment --
# the same frozen snapshot described above -- then re-broadcast to every pane it
# spawns. Each pane's bash concludes it is already downstream of a handoff, so
# every pane silently stays bash and the `default-shell` pin above buys nothing.
# Self-perpetuating, too: kill the server, restart it from a fish pane, and the
# marker is back.
#
# Measured 2026-09-04: a plain `tmux new-window` landed in bash, while the same
# window spawned as `env -u DOTFILES_FISH_SHELL bash -l` landed in fish -- one
# variable between them. Unsetting here repairs the whole server, since the
# config is read at server start and again on `prefix R`.
#
# Scoped to this host deliberately, though the hazard is not container-specific:
# sh/fish.sh is in every BASH_* profile, so any server on any machine where an
# interactive bash ran could freeze the marker the same way. The other machines
# behave correctly today, and this is a live-environment change rather than a
# cosmetic one, so it stays next to the `default-shell` pin it exists to serve
# rather than altering hosts with nothing to fix. If a Mac or remote server ever
# comes up with panes stuck in bash, check `tmux show-environment -g
# DOTFILES_FISH_SHELL` first -- this is the same bug, and the fix promotes to
# options.conf unchanged.
#
# `-u` (unset in tmux's table) is enough; `-r` (remove before spawning) is not
# needed -- verified by probe. The escape hatch is untouched: `bash` inside fish
# still stays bash, because there the marker reaches the child by ordinary env
# inheritance from the live fish, not through this table.
set-environment -gu DOTFILES_FISH_SHELL

# Prefix — no outer layer here, so the shared C-a is safe (same as host-local).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse stays on (shared default from options.conf) — OSC 52 clipboard is
# broken in this environment regardless of mouse mode (no bridge available
# either way: no xclip/xsel/wl-copy, no $DISPLAY), so turning it off bought
# nothing but lost pane resize/click-select/scroll-wheel. See tmux/README.md
# sharp edges for the actual (unresolved) copy-to-system-clipboard situation.

# No set-titles: this pty's title escapes don't reach the real browser tab
# (VS Code's own terminal panel manages its own label, not the OS window/tab
# chrome), so there's nothing for it to usefully control here.

# Theme: green accent (distinct from local's blue and remote's peach — a
# third, non-nested context gets its own color rather than reusing either).
set -g pane-active-border-style "fg=#a6e3a1,bold"
set -g pane-border-status top
set -g pane-border-format " #P · #{pane_current_command} "
set -g window-status-current-style "bg=#a6e3a1,fg=#1e1e2e,bold"
set -g status-left-length 46
set -g status-left "#[bg=#313244] web:#S #[default]"
