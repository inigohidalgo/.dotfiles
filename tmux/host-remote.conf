# =============================================================================
# Host overrides — remote (inner, reached over SSH inside outer tmux)
# =============================================================================
# Sourced last: everything here overrides the shared confs.
# Intentionally dropped vs host-local (see tmux/README.md):
#   - set-titles: outer tmux owns the terminal title
#   - pane-border-status row: outer already labels the SSH pane; would stack

# Prefix — M-a (Opt+A) so it doesn't collide with outer C-a. Same letter,
# one mod added; Ghostty treats Opt as Meta, and ESC+a round-trips through
# SSH and the outer tmux trivially.
unbind C-b
set -g prefix M-a

# Theme: peach accent (inner-layer cue), lean bar with an ssh tag plus the
# actual session name
set -g pane-border-style "fg=#45475a,bg=#11111b"
set -g pane-active-border-style "fg=#fab387,bg=#11111b,bold"
set -g window-status-current-style "bg=#fab387,fg=#1e1e2e,bold"
set -g status-left-length 46
set -g status-left "#[bg=#313244] ssh:#S #[default]"

# Pane background: crust instead of shared theme's bg=terminal passthrough —
# tints the actual terminal background a shade darker so panes read as
# "nested a layer deeper" even without checking the accent/prefix. Trade-off:
# window-active-style loses true passthrough, so apps with their own theme
# (nvim, image previews) sit on this tint instead of the terminal's real bg.
# Border style bg matches, so dividers blend into the tint rather than
# showing a passthrough seam.
setw -g window-style "fg=#a6adc8,bg=#11111b"
setw -g window-active-style "fg=terminal,bg=#11111b"
